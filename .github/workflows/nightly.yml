name: Nightly Production E2E Smoke & Health Suite

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

jobs:
  nightly-smoke:
    name: Nightly Production E2E Against kinich.app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Full Production E2E Test Suite
        env:
          BASE_URL: 'https://kinich.app'
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npx playwright test

      - name: Upload Nightly Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Create GitHub Issue on Nightly Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly E2E Test Failure on kinich.app - ${new Date().toISOString().split('T')[0]}`,
              body: `Automated Nightly Production E2E test suite failed against https://kinich.app.\n\nPlease inspect the workflow run artifacts for traces, screenshots, and videos.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

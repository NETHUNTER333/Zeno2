name: Kinich E2E Tests & PR Checks

on:
  pull_request:
    branches: [ main, master ]
  deployment_status:

jobs:
  blocking-checks:
    name: Blocking E2E Suites (smoke, seo, health, share-card)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Blocking E2E Tests
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url || 'https://kinich.app' }}
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/seo.spec.ts tests/e2e/health.spec.ts tests/e2e/share-card.spec.ts

      - name: Upload Test Report & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocking-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  external-checks:
    name: Non-Blocking External Suites (@external)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run External Live Service Tests
        env:
          BASE_URL: ${{ github.event.deployment_status.target_url || 'https://kinich.app' }}
        run: npx playwright test --grep "@external"

      - name: Upload External Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
